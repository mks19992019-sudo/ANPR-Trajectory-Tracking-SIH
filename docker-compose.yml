version: '3.8'

services:
  # PostGIS / PostgreSQL Spatial Database
  db:
    image: postgis/postgis:15-3.3
    container_name: anpr_spatial_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anpr_admin -d anpr_traffic_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anpr_backend_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - FUTURE_TIMESTAMP_TOLERANCE_SECONDS=300
      - IMPOSSIBLE_SPEED_THRESHOLD_KMPH=160.0
      - SUSPICIOUS_SPEED_THRESHOLD_KMPH=120.0
      - ANPR_API_KEY=${ANPR_API_KEY:?set ANPR_API_KEY}
      - REQUIRE_API_KEY=true
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"

  # React Frontend Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: anpr_frontend_ui
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
